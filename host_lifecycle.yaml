# Stop/install/uninstall модульного демона: install-services / uninstall-services
# и тесты deployment (см. .cursor/rules/host-lifecycle.mdc).
# API/worker модуля — только при MODULE_RUNTIME=microservice и имени в MICROSERVICE_MODULES.
module: ollama_framework
host:
  stop_commands:
    - ollama_framework:stop-ollama
  install_service_commands:
    - ollama_framework:install-ollama-service
    - install-module-service --module=ollama_framework --kind=api
    - install-module-service --module=ollama_framework --kind=worker
  uninstall_service_commands:
    - ollama_framework:uninstall-ollama-service
    - uninstall-module-service --module=ollama_framework --kind=api
    - uninstall-module-service --module=ollama_framework --kind=worker
  service_units:
    - ergo-ollama
    - ergo_ms_module_ollama_framework_api
    - ergo_ms_module_ollama_framework_worker

