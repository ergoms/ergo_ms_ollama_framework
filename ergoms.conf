# Ollama — команды ergoms (префикс: ollama_framework:)
# Ops (pull/start/stop/status) — без Django; api:* оставлены как совместимость

# Runtime / модели — скрипты deployment
ollama=win:virtual_env\python\Scripts\python.exe modules\ollama_framework\deployment\ollama_cli.py && linux:virtual_env/python/bin/python modules/ollama_framework/deployment/ollama_cli.py
ollama-status=win:virtual_env\python\Scripts\python.exe modules\ollama_framework\deployment\ollama_status.py && linux:virtual_env/python/bin/python modules/ollama_framework/deployment/ollama_status.py
start-ollama=win:virtual_env\python\Scripts\python.exe modules\ollama_framework\deployment\start_ollama.py && linux:virtual_env/python/bin/python modules/ollama_framework/deployment/start_ollama.py
stop-ollama=win:virtual_env\python\Scripts\python.exe modules\ollama_framework\deployment\stop_ollama.py && linux:virtual_env/python/bin/python modules/ollama_framework/deployment/stop_ollama.py

# Установка пакета — без Django (скрипт + кэш архива)
install-ollama=win:virtual_env\python\Scripts\python.exe modules\ollama_framework\deployment\install_ollama.py && linux:virtual_env/python/bin/python modules/ollama_framework/deployment/install_ollama.py
uninstall-ollama=win:virtual_env\python\Scripts\python.exe modules\ollama_framework\deployment\uninstall_ollama.py && linux:virtual_env/python/bin/python modules/ollama_framework/deployment/uninstall_ollama.py

# Установка и управление службой ergo-ollama
install-ollama-service=win:powershell -ExecutionPolicy Bypass -File modules/ollama_framework/deployment/windows/install-ollama-service.ps1 && linux:bash modules/ollama_framework/deployment/linux/install-ollama-service.sh
start-ollama-service=win:net start ergo-ollama && linux:systemctl start ergo-ollama
stop-ollama-service=win:net stop ergo-ollama && linux:systemctl stop ergo-ollama
restart-ollama-service=win:net stop ergo-ollama && net start ergo-ollama && linux:systemctl restart ergo-ollama
status-ollama-service=win:sc query ergo-ollama && linux:systemctl status ergo-ollama
