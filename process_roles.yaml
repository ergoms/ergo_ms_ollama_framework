# Учёт процесса Ollama в ergoms resource-usage (см. .cursor/rules/process-roles.mdc).
module: ollama_framework
roles:
  - id: ollama
    reserve_host_budget: true
    # Запас VRAM под загруженные веса; подстройте под свои модели.
    reserve_vram_mb: 4096
    process_names:
      - ollama
      - ollama.exe
    # OR между элементами when; AND внутри одного элемента
    when:
      - cmdline_contains_any:
          - virtual_env/packages/ollama
      - cmdline_contains_any:
          - ollama
        project_bound: true
  - id: module-api:ollama_framework
    when:
      - cmdline_contains_any:
          - start_module_api.py
          - --module=ollama_framework
        project_bound: true
  - id: module-worker:ollama_framework
    when:
      - cmdline_contains_any:
          - start_celery_worker.py
          - --module=ollama_framework
        project_bound: true

