# Задачи VS Code / Cursor (тип ergo-module).
# Discovery: расширение ergo-ms-tasks → Run Task / setup-full / start-all.
module: ollama_framework
tasks:
  - label: "Ollama: Install"
    detail: "Установить portable Ollama в virtual_env/packages"
    command: "ergoms ollama_framework:install-ollama"
    hide: true
    include_in:
      - setup-full

  - label: "Ollama: Start"
    detail: "Запустить процесс Ollama в терминале"
    command: "ergoms ollama_framework:start-ollama"
    stop_command: "ergoms ollama_framework:stop-ollama"
    panel: new
    include_in:
      - start-all

  - label: "Ollama: Logs"
    detail: "Открыть хвост логов Ollama"
    command: "ergoms ollama_framework:logs-ollama 500"
    hide: true
    include_in:
      - logs-all
